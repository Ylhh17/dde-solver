name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package Windows application
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 24
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "24"
          cache: maven

      - name: Build application image
        shell: pwsh
        run: .\scripts\package-windows.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: DDE-Solver-1.0.0-windows-x64
          path: target/distribution/DDE-Solver-1.0.0-windows-x64.zip
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$env:GITHUB_REF_NAME"
          "target/distribution/DDE-Solver-1.0.0-windows-x64.zip"
          --verify-tag
          --generate-notes
          --title "DDE Solver $env:GITHUB_REF_NAME"
